version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: hotelops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotelops
      POSTGRES_PASSWORD: hotelops
      POSTGRES_DB: hotelops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelops -d hotelops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hotelops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: node:20-alpine
    container_name: hotelops-migrate
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hotelops:hotelops@db:5432/hotelops?schema=public}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    profiles:
      - setup

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: hotelops-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hotelops:hotelops@db:5432/hotelops?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://hotelops:hotelops@db:5432/hotelops?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-0123456789}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-0123456789}
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: hotelops-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata: