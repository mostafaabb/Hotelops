# fly.toml app configuration file generated for hotelops-api on 2026-10-20T17:34:18+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'hotelops-api'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile.api'

[env]
  NODE_ENV = 'production'
  PORT = '4000'

[[mounts]]
  source = 'hotelops_data'
  destination = '/app/apps/api/uploads'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/v1/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
